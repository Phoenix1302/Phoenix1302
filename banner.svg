<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <!-- SUBTLE CYBER GRID PATTERN -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="0.75" />
    </pattern>

    <!-- SOFT AMBIENT GLOW -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- TITLE METALLIC GRADIENT -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e6edf3" />
      <stop offset="100%" stop-color="#8b949e" />
    </linearGradient>

    <!-- STATUS DOT PULSE -->
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .dot {
        transform-origin: 295px 115px;
        animation: pulseDot 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND CARD -->
  <rect width="850" height="160" rx="12" fill="#0d1117" />
  
  <!-- GRID OVERLAY -->
  <rect width="850" height="160" rx="12" fill="url(#grid)" />
  
  <!-- AMBIENT RADIAL LIGHT -->
  <rect width="850" height="160" rx="12" fill="url(#ambient)" />

  <!-- SUBTLE HAIRLINE CARD BORDER -->
  <rect x="0.5" y="0.5" width="849" height="159" rx="11.5" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- CONTENT -->
  <!-- Top Tag -->
  <text x="425" y="44" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#7d8590" letter-spacing="3" font-weight="500">
    SYSTEMS // NETWORK PROTOCOLS // OBSCURITY
  </text>

  <!-- Main Title -->
  <text x="425" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5px" fill="url(#textGrad)">
    Phoenix1302
  </text>

  <!-- Status Line -->
  <g text-anchor="middle">
    <!-- Active Status Indicator Dot -->
    <circle cx="282" cy="116" r="3.5" fill="#3fb950" class="dot" />
    <!-- Subtitle text -->
    <text x="430" y="120" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="12" fill="#8b949e" letter-spacing="1px">
      stealth tunnels • zero-logs architecture • hardened core
    </text>
  </g>
</svg>
