<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <!-- BACKGROUND GRID -->
    <pattern id="subtleGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="0.7" />
    </pattern>

    <!-- AMBIENT BACKGROUND GLOW BEHIND ACRYLIC -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#1f6feb" stop-opacity="0.16" />
      <stop offset="75%" stop-color="#8957e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- ACRYLIC FROSTED GLASS BORDER GRADIENT -->
    <linearGradient id="acrylicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>

    <!-- PURE METALLIC WHITE TITLE GRADIENT (NO STROKE) -->
    <linearGradient id="pureTitleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>

    <!-- BACKDROP BLUR FILTERS -->
    <filter id="deepBackdropBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <filter id="acrylicGlassFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glassGlow" />
      <feMerge>
        <feMergeNode in="glassGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- STATUS PULSE -->
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.92); }
      }
      .dot {
        transform-origin: 285px 123px;
        animation: pulseDot 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- BASE DARK BACKGROUND -->
  <rect width="850" height="170" rx="12" fill="#0d1117" />
  
  <!-- GRID PATTERN -->
  <rect width="850" height="170" rx="12" fill="url(#subtleGrid)" />

  <!-- AMBIENT COLOR AURA -->
  <circle cx="425" cy="85" r="260" fill="url(#auraGlow)" />

  <!-- EXTERNAL CARD OUTLINE -->
  <rect x="0.5" y="0.5" width="849" height="169" rx="11.5" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- ==================== ACRYLIC BACKDROP (BLURRED & DARKENED) ==================== -->
  <!-- Darkened Gaussian blurred backing shadow -->
  <rect x="175" y="25" width="500" height="120" rx="20" fill="#03060a" opacity="0.75" filter="url(#deepBackdropBlur)" />

  <!-- Secondary ambient diffused shadow -->
  <rect x="180" y="28" width="490" height="114" rx="18" fill="#090d16" opacity="0.6" filter="url(#deepBackdropBlur)" />

  <!-- ==================== ACRYLIC FROSTED GLASS PANEL ==================== -->
  <!-- Acrylic Glass Body (Subtle translucent glassmorphism) -->
  <rect x="185" y="27" width="480" height="116" rx="16" fill="#161b22" fill-opacity="0.48" stroke="url(#acrylicBorder)" stroke-width="1.2" />

  <!-- Subtle Specular Reflection Highlight along top inner rim of glass -->
  <line x1="205" y1="28.5" x2="645" y2="28.5" stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round" />

  <!-- ==================== CARD CONTENT (CLEAN & SHARP, NO DARK OUTLINE) ==================== -->
  <g text-anchor="middle">
    <!-- Top Micro Tag -->
    <text x="425" y="52" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#8b949e" letter-spacing="3" font-weight="500">
      SYSTEMS // NETWORK PROTOCOLS // OBSCURITY
    </text>

    <!-- Main Nickname (Clean, High-Res, ZERO Stroke/Outline) -->
    <text x="425" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5px" fill="url(#pureTitleGrad)" stroke="none">
      Phoenix1302
    </text>

    <!-- Status Line with Pulsing Green Dot -->
    <circle cx="282" cy="122" r="3.5" fill="#3fb950" class="dot" />
    <text x="430" y="126" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="12" fill="#8b949e" letter-spacing="1px" stroke="none">
      stealth tunnels • zero-logs architecture • hardened core
    </text>
  </g>
</svg>
